<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionTech - Connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c1e3d 0%, #1a3a6b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            display: flex;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #1a3a6b 0%, #0c1e3d 100%);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 3px solid #dc2626;
        }

        .login-left h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2563eb 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
        }

        .login-left p {
            font-size: 1.2em;
            line-height: 1.6;
            opacity: 0.9;
        }

        .login-right {
            flex: 1;
            padding: 60px 40px;
        }

        .login-form h2 {
            color: #1a3a6b;
            font-size: 2em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #1a3a6b;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a3a6b;
            box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.15);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #1a3a6b 0%, #0c1e3d 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(26, 58, 107, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 58, 107, 0.6);
            filter: brightness(1.1);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border-left: 5px solid #dc2626;
        }

        .alert-success {
            background: #d1fae5;
            color: #059669;
            border-left: 5px solid #059669;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #1a3a6b;
            border-bottom-color: #dc2626;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .login-left {
                padding: 40px 30px;
            }

            .login-right {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-left">
                <h1>🔍 VisionTech</h1>
                <p>Extraction automatique des valeurs d'un document technique</p>
                <p style="margin-top: 20px;">Connectez-vous pour accéder à l'application</p>
            </div>

            <div class="login-right">
                <div class="tabs">
                    <div class="tab" :class="{ active: activeTab === 'login' }" @click="activeTab = 'login'">
                        Connexion
                    </div>
                    <div class="tab" :class="{ active: activeTab === 'register' }" @click="activeTab = 'register'">
                        Inscription
                    </div>
                </div>

                <!-- Login Form -->
                <div v-if="activeTab === 'login'" class="login-form">
                    <h2>Connexion</h2>

                    <div v-if="errorMessage" class="alert alert-error">
                        ❌ {{ errorMessage }}
                    </div>

                    <form @submit.prevent="handleLogin">
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input 
                                type="text" 
                                id="username" 
                                v-model="loginForm.username" 
                                required
                                placeholder="Entrez votre nom d'utilisateur"
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input 
                                type="password" 
                                id="password" 
                                v-model="loginForm.password" 
                                required
                                placeholder="Entrez votre mot de passe"
                            >
                        </div>

                        <button type="submit" class="btn-login" :disabled="loading">
                            {{ loading ? '⏳ Connexion...' : '🔐 Se connecter' }}
                        </button>
                    </form>

                    <div class="register-link">
                        <p style="margin-top: 20px; font-size: 0.9em;">
                            Compte par défaut: <strong>admin</strong> / <strong>admin123</strong>
                        </p>
                    </div>
                </div>

                <!-- Register Form -->
                <div v-if="activeTab === 'register'" class="login-form">
                    <h2>Inscription</h2>

                    <div v-if="errorMessage" class="alert alert-error">
                        ❌ {{ errorMessage }}
                    </div>

                    <div v-if="successMessage" class="alert alert-success">
                        ✅ {{ successMessage }}
                    </div>

                    <form @submit.prevent="handleRegister">
                        <div class="form-group">
                            <label for="reg-name">Nom complet</label>
                            <input 
                                type="text" 
                                id="reg-name" 
                                v-model="registerForm.name" 
                                required
                                placeholder="Votre nom complet"
                            >
                        </div>

                        <div class="form-group">
                            <label for="reg-username">Nom d'utilisateur</label>
                            <input 
                                type="text" 
                                id="reg-username" 
                                v-model="registerForm.username" 
                                required
                                placeholder="Choisissez un nom d'utilisateur"
                            >
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Mot de passe</label>
                            <input 
                                type="password" 
                                id="reg-password" 
                                v-model="registerForm.password" 
                                required
                                placeholder="Choisissez un mot de passe"
                            >
                        </div>

                        <button type="submit" class="btn-login" :disabled="loading">
                            {{ loading ? '⏳ Inscription...' : '📝 S\'inscrire' }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    activeTab: 'login',
                    loginForm: {
                        username: '',
                        password: ''
                    },
                    registerForm: {
                        name: '',
                        username: '',
                        password: ''
                    },
                    loading: false,
                    errorMessage: '',
                    successMessage: '',
                    apiUrl: 'http://localhost:5000/api'
                }
            },
            methods: {
                async handleLogin() {
                    this.loading = true;
                    this.errorMessage = '';

                    try {
                        const response = await axios.post(`${this.apiUrl}/login`, this.loginForm);
                        
                        // Store token and user info
                        localStorage.setItem('token', response.data.token);
                        localStorage.setItem('user', JSON.stringify(response.data.user));

                        // Redirect to main app
                        window.location.href = '/';
                    } catch (error) {
                        this.errorMessage = error.response?.data?.error || 'Erreur de connexion';
                    } finally {
                        this.loading = false;
                    }
                },

                async handleRegister() {
                    this.loading = true;
                    this.errorMessage = '';
                    this.successMessage = '';

                    try {
                        await axios.post(`${this.apiUrl}/register`, this.registerForm);
                        
                        this.successMessage = 'Inscription réussie! Vous pouvez maintenant vous connecter.';
                        this.registerForm = { name: '', username: '', password: '' };
                        
                        // Switch to login tab after 2 seconds
                        setTimeout(() => {
                            this.activeTab = 'login';
                            this.successMessage = '';
                        }, 2000);
                    } catch (error) {
                        this.errorMessage = error.response?.data?.error || 'Erreur lors de l\'inscription';
                    } finally {
                        this.loading = false;
                    }
                }
            },
            mounted() {
                // Check if user is already logged in
                const token = localStorage.getItem('token');
                if (token) {
                    window.location.href = '/';
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
